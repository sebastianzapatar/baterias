name: Desplegar página del proyecto

# Publica index.html y el manual en PDF de la rama main en GitHub Pages.
# La página es estática y lleva los datos y las figuras embebidos: no hay que
# instalar nada ni recalcular.
#
# Requisito de una sola vez: en Settings -> Pages, poner Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'Manual_Ejecucion_Cuadernos_EIA.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp index.html Manual_Ejecucion_Cuadernos_EIA.pdf _sitio/
          touch _sitio/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
